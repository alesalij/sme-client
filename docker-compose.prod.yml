version: '3.8'

services:
  # Nginx Reverse Proxy (единый для frontend + backend)
  nginx:
    image: nginx:alpine
    container_name: sme_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - client
      - backend
    restart: always
    networks:
      - sme_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Application
  client:
    build:
      context: ./client-data-sme
      dockerfile: Dockerfile
    container_name: sme_client
    expose:
      - "80"
    env_file:
      - ./client-data-sme/.env
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - sme_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sme_client_backend
    expose:
      - "3001"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - sme_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  sme_network:
    driver: bridge

volumes:
  nginx-logs: